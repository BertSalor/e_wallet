<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#101a33" />
    <title>Admin Console | StudentWallet</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/css/admin.css" />
    <script defer src="/assets/js/api.js"></script>
    <script defer src="/assets/js/admin.js"></script>
  </head>
  <body>
    <div class="admin-shell">
      <aside class="sidebar" id="sidebar">
        <a class="brand" href="/admin.html"
          ><span class="brand-mark">B</span
          ><span><b>StudentWallet</b><small>ADMIN CONSOLE</small></span></a
        >
        <div class="nav-caption">WORKSPACE</div>
        <nav id="admin-nav" aria-label="Admin navigation">
          <button class="nav-link active" data-page="dashboard">
            <span>▦</span>Dashboard
          </button>
          <button class="nav-link" data-page="users">
            <span>♙</span>User Management
          </button>
          <button class="nav-link" data-page="accounts">
            <span>▣</span>Account &amp; Wallet Management
          </button>
          <button class="nav-link" data-page="transactions">
            <span>⇄</span>Transaction Management
          </button>
          <button class="nav-link" data-page="categories">
            <span>▤</span>Categories Management
          </button>
          <button class="nav-link" data-page="reports">
            <span>▥</span>Reports &amp; Analytics
          </button>
          <button class="nav-link" data-page="pdc">
            <span>⚡</span>Parallel Computing (PDC)
          </button>
          <button class="nav-link" data-page="announcements">
            <span>♧</span>Notifications &amp; Announcements
          </button>
          <button class="nav-link" data-page="logs">
            <span>☷</span>Activity Logs
          </button>
          <button class="nav-link" data-page="settings">
            <span>⚙</span>System Settings
          </button>
          <button class="nav-link" data-page="backups">
            <span>▣</span>Database &amp; Backup
          </button>
          <button class="nav-link" data-page="security">
            <span>⬡</span>Security Management
          </button>
        </nav>
        <div class="sidebar-bottom">
          <div class="admin-mini">
            <span class="avatar">A</span
            ><span
              ><b id="side-admin-name">Administrator</b
              ><small>System administrator</small></span
            >
          </div>
          <button class="nav-link logout" id="logout-btn">
            <span>↪</span>Logout
          </button>
        </div>
      </aside>
      <main class="main-area">
        <header class="topbar">
          <button class="mobile-menu" id="mobile-menu" aria-label="Open menu">
            ☰
          </button>
          <div>
            <div class="eyebrow">BLUEWALLET / ADMINISTRATION</div>
            <h1 id="page-title">Dashboard</h1>
          </div>
          <div class="top-actions">
            <span class="live-dot">System console</span
            ><span class="top-avatar" id="top-avatar">A</span>
          </div>
        </header>
        <div class="content" id="page-content">
          <div class="loading">Checking administrator access…</div>
        </div>
        <div class="toast" id="toast" role="status"></div>
      </main>
    </div>
    <div class="modal-backdrop" id="modal-backdrop" hidden>
      <section
        class="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modal-title"
      >
        <div class="modal-head">
          <h2 id="modal-title">Edit record</h2>
          <button class="icon-btn" id="modal-close" aria-label="Close">
            ×
          </button>
        </div>
        <div id="modal-body"></div>
      </section>
    </div>
  </body>
</html>
